# LanJing git hooks
# - pre-commit: staged 快路径（FE 与 cargo fmt 并行）
# - commit-msg: conventional commits
# - pre-push: 全量门禁（web ∥ rust）

pre-commit:
  parallel: true
  jobs:
    # oxlint 只认代码文件，oxfmt 还要管 css/html/json；两者共用一个 glob 时，
    # 只暂存 css 的提交会让 oxlint 拿到空输入并以 1 退出。拆成串行两步。
    - name: oxlint-oxfmt-src
      group:
        piped: true
        jobs:
          - name: oxlint
            # lefthook 的 `src/**/…` 匹配不到 `src/` 根层的文件（App.tsx /
            # main.tsx / index.css 正好都在那里），所以要显式加一条。
            glob:
              - src/*.{ts,tsx,js,jsx}
              - src/**/*.{ts,tsx,js,jsx}
            run: pnpm exec oxlint --fix {staged_files}
            stage_fixed: true
          - name: oxfmt
            glob:
              - src/*.{ts,tsx,js,jsx,css,html,json}
              - src/**/*.{ts,tsx,js,jsx,css,html,json}
            run: pnpm exec oxfmt --write {staged_files}
            stage_fixed: true

    - name: oxfmt-root
      # lefthook 的 * 会匹配任意深度 basename；只列仓库根配置，避免扫到 src/messages
      glob:
        - package.json
        - components.json
        - tsconfig.json
        - '*.config.js'
        - '*.config.mjs'
        - '*.config.ts'
        - '*.config.cjs'
      run: pnpm exec oxfmt --write {staged_files}
      stage_fixed: true

    - name: cargo-fmt
      glob: src-tauri/**/*.rs
      # workspace 必须 --all，否则只格式化根包，子 crate/测试会漏
      run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    # 与根目录 `pnpm verify` 的两个阶段逐一对应；改动其一必须同步另一个。
    # `pnpm check` 已包含 test:web，不要再在后面接一次 test:web。
    - name: web
      run: pnpm check

    - name: rust
      run: >
        cargo clippy --manifest-path src-tauri/Cargo.toml --workspace
        --all-targets --all-features -- -D warnings
        && cargo test --manifest-path src-tauri/Cargo.toml --workspace
